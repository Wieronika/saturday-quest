<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel date?</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe3cc;--bg2:#e6d5b6;--blue:#7fb0c9;--deep:#3d6a8a;--ink:#1f2f45;--cream:#fbf5e8;--pink:#f27fa5;--pink2:#d9588a}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"Press Start 2P",ui-monospace,Consolas,monospace;color:var(--ink);font-size:12px;line-height:1.8;
 background-color:var(--bg);background-image:linear-gradient(45deg,var(--bg2) 25%,transparent 25% 75%,var(--bg2) 75%),linear-gradient(45deg,var(--bg2) 25%,transparent 25% 75%,var(--bg2) 75%);
 background-size:32px 32px;background-position:0 0,16px 16px;display:flex;justify-content:center;padding:22px 14px;overflow-x:hidden}
.wrap{width:min(760px,100%);position:relative;z-index:1}
.frame{background:var(--cream);border:4px solid var(--ink);padding:20px;position:relative;box-shadow:10px 10px 0 var(--blue),10px 10px 0 4px var(--ink)}
.bar{display:flex;justify-content:space-between;gap:10px;font-size:9px;margin:-6px 0 14px;flex-wrap:wrap}
.hp{color:var(--pink2);letter-spacing:2px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:4px solid var(--ink);margin-bottom:18px}
h1{font-size:clamp(15px,3.4vw,24px);margin:0 0 14px;line-height:1.5;color:var(--pink);text-shadow:3px 3px 0 var(--ink)}
p{margin:0 0 14px}
.dialog{background:#fff;border:4px solid var(--ink);padding:14px;min-height:104px;font-size:clamp(10px,1.7vw,12px);position:relative;margin-bottom:16px}
.dialog:after{content:"\25BC";position:absolute;right:10px;bottom:6px;color:var(--pink2);animation:b 1s steps(2) infinite}
.ticket{display:grid;grid-template-columns:repeat(2,1fr);border:4px solid var(--ink);margin-bottom:16px;background:#fff}
.ticket div{padding:12px;border:2px solid var(--ink);font-size:11px}
.ticket small{display:block;font-size:8px;color:var(--pink2);margin-bottom:6px}
.ticket .wide{grid-column:1/3;background:#dcebf3}
.btn{font:inherit;font-size:13px;padding:14px 20px;border:4px solid var(--ink);background:var(--blue);color:var(--ink);cursor:pointer;box-shadow:5px 5px 0 var(--ink)}
.btn.yes{background:var(--pink)}
.btn:hover,.btn:focus-visible{background:var(--ink);color:#fff;outline:none}
.btn:active{transform:translate(5px,5px);box-shadow:none}
.btn.no{background:#e9e1d2}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:center;min-height:90px}
.btns{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.btns .btn{font-size:11px}
.big{font-size:56px;line-height:1;text-align:center;margin:6px 0 16px;animation:pulse 1s steps(2) infinite}
.hide{display:none}
.small{font-size:9px;line-height:1.9}
@keyframes b{50%{opacity:0}}
@keyframes pulse{50%{transform:scale(1.12)}}
.pet{position:fixed;top:-20px;width:10px;height:10px;background:var(--pink);border:2px solid var(--ink);animation:fall linear infinite;pointer-events:none;z-index:0}
@keyframes fall{to{transform:translate(60px,110vh) rotate(300deg)}}
.heart{position:fixed;pointer-events:none;font-size:22px;animation:up 2.4s linear forwards;z-index:9}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.pet,.heart,.dialog:after,.big{animation:none}}
</style>
</head>
<body>
<div id="petals"></div>
<div class="wrap"><main class="frame">
 <div class="bar"><span>PLAYER 2: YOU</span><span class="hp">&#9829;&#9829;&#9829;&#9829;&#9829;</span><span>LV. DATE</span></div>
 <canvas id="scene" width="320" height="140" aria-label="Two pixel characters playing padel by a river with a tiny city behind"></canvas>

 <section id="s0">
  <h1>A NEW QUEST<br>HAS APPEARED</h1>
  <p class="dialog" id="d0"></p>
  <button class="btn" id="start">START</button>
 </section>

 <section id="s1" class="hide">
  <h1>PADEL DATE?</h1>
  <div class="ticket">
   <div><small>WHAT</small>Padel, just us two</div>
   <div><small>WHERE</small>Aarhus</div>
   <div><small>DAY</small>Saturday 14 Nov</div>
   <div><small>TIME</small>11:00</div>
   <div class="wide"><small>REWARD</small>One very happy me, plus winner picks the lunch</div>
  </div>
  <p>Will you join me?</p>
  <div class="row" id="row"><button class="btn yes" id="yes">YES!</button><button class="btn no" id="no">NO</button></div>
  <p class="small" id="hint"></p>
 </section>

 <section id="s2" class="hide">
  <h1>QUEST ACCEPTED!</h1>
  <div class="big" aria-hidden="true">&#128151;</div>
  <p>Now send me a pink heart, so I’ll know.</p>
  <p class="small">Saturday 14 Nov, 11:00, Aarhus.</p>
  <div class="btns"><button class="btn yes" id="copy">COPY THE HEART</button><button class="btn" id="fact">ONE INTERESTING FACT FOR THE DAY</button></div>
  <p class="small" id="cs" role="status"></p>
  <p class="dialog hide" id="factbox" aria-live="polite"></p>
 </section>
</main></div>

<script>
/* ---------- original pixel sprites (rows are centred) ---------- */
var PAL={o:"#1f2f45",h:"#241a33",s:"#ffd7b8",c:"#ff9db5",e:"#1f2f45",m:"#b03a48",r:"#f27fa5",R:"#d6453d",t:"#3cc4c0",b:"#35557a",g:"#ffd23f",p:"#f27fa5",P:"#c9427a",w:"#ffffff"};
var BOY=["o.oo.oo.o","ohhhhhhhhho","orrrrrrrrro","ohsssssssho","ohsesssesho","ohsesssesho","ohcssssscho","ohssmmmssho","ossssso","ossso","oRRRRRRRRRo","ossRRRRRRRsso","ossRRRRRRRsso","ossRRRRRRRsso","oRRRRRRRo","obbbbbbbo","obbbo.obbbo","ossso.ossso","ooooo.ooooo"];
var GIRL=["ooooooooo","ohhhhhhhhho","ohhhhhhhhhhho","ohhhhsssshhho","ohhsessseshho","ohhsssssssshho","ohhcssmsschho","oghssssshgo","ohhhosssohhho","ohhhoppwppohhho","ohhhopppppppohhho","ohhhoppwwwppohhho","ohhhopppwpppohhho","ohhhopppppppohhho","ohhhoPPPPPPPohhho","ohho.ss.ss.ohho","ohh.oo.oo.hho"];
var cv=document.getElementById("scene"),cx=cv.getContext("2d"),W=320;
function rect(c,x,y,w,h){cx.fillStyle=c;cx.fillRect(x,y,w,h)}
function spr(map,cxm,y,flip,sc){var w=0;map.forEach(function(r){w=Math.max(w,r.length)});
 map.forEach(function(row,ry){var off=Math.floor((w-row.length)/2);
  for(var i=0;i<row.length;i++){var ch=row[i];if(ch==="."||!PAL[ch])continue;
   var x=off+i;if(flip)x=w-1-x;rect(PAL[ch],Math.round(cxm-w*sc/2+x*sc),y+ry*sc,sc,sc)}})}
function racket(x,y){rect("#1f2f45",x,y+9,2,8);rect("#1f2f45",x-4,y,10,9);rect("#f27fa5",x-3,y+1,8,7);rect("#fff",x-1,y+3,1,1);rect("#fff",x+2,y+3,1,1);rect("#fff",x,y+5,1,1)}
var t=0;
function draw(){
 ["#f8efdc","#f4e8d0","#f0e1c5","#ecdabb","#e8d3b2"].forEach(function(c,i){rect(c,0,i*12,W,12)});
 // pale pink sun
 var sx=232,sy=40;cx.fillStyle="#f6b5c8";for(var yy=-13;yy<=13;yy+=2){var hw=Math.floor(Math.sqrt(169-yy*yy));cx.fillRect(sx-hw,sy+yy,hw*2,2)}
 // clouds
 var a=(t/14)%360-40;rect("#fff",a,14,30,6);rect("#fff",a+6,9,16,6);
 var b=((t/20)+180)%360-40;rect("#fff",b,28,22,5);rect("#fff",b+5,24,12,5);
 // tiny city (far, pale then near, darker)
 var far=[[4,56,12],[22,50,10],[40,58,14],[62,52,10],[84,57,13],[110,54,11],[140,58,12],[168,50,10],[196,56,14],[222,52,12],[250,58,12],[276,54,14],[300,50,12]];
 far.forEach(function(q){rect("#b9cfdc",q[0],q[1],q[2],40)});
 var near=[[0,64,14],[18,60,12],[34,66,16],[56,58,10],[74,64,14],[100,62,12],[128,66,14],[150,60,10],[176,64,16],[206,62,12],[232,66,14],[258,60,12],[284,64,16]];
 near.forEach(function(q){rect("#8fb0c6",q[0],q[1],q[2],36);rect("#f4e8d0",q[0]+3,q[1]+4,2,2);rect("#f4e8d0",q[0]+q[2]-5,q[1]+10,2,2);rect("#f4e8d0",q[0]+3,q[1]+16,2,2)});
 rect("#6f93ae",112,38,5,60);rect("#6f93ae",111,34,7,5);rect("#f27fa5",113,30,3,5); // tall tower
 rect("#6f93ae",190,44,4,50);rect("#6f93ae",189,42,6,3);
 // river
 rect("#7fb0c9",0,90,W,16);rect("#6a9bb8",0,90,W,2);
 for(var i=0;i<26;i++){rect("#a9d0e2",(i*13+t/3)%330-10,93+(i%4)*3,9,1)}
 for(var j=0;j<10;j++){rect("#5f8fac",(j*34+6)%320,95+(j%3)*3,6,2)}
 // bridge
 rect("#4a6f8c",20,86,96,4);for(var k=0;k<5;k++){rect("#4a6f8c",28+k*20,90,4,8)}rect("#f27fa5",20,85,96,1);
 // boat
 var bo=((t/10)+60)%380-40;rect("#f4e8d0",bo,98,18,4);rect("#d9588a",bo+2,94,6,4);rect("#fff",bo+9,90,1,8);rect("#fff",bo+9,90,5,7);
 // bank + court
 rect("#e8d5b0",0,106,W,34);rect("#d4bf96",0,106,W,2);
 rect("#6f9ab8",24,112,272,26);
 rect("#fff",24,112,272,2);rect("#fff",24,136,272,2);rect("#fff",24,112,2,26);rect("#fff",294,112,2,26);rect("#fff",159,112,2,26);
 // net
 rect("#1f2f45",155,92,3,46);rect("#1f2f45",162,92,3,46);
 for(var y=96;y<134;y+=4)rect("#fff",158,y,4,1);
 rect("#f27fa5",155,92,10,2);
 // players
 var b1=Math.round(Math.sin(t/8)),b2=Math.round(Math.sin(t/8+3));
 spr(BOY,70,94+b1,false,2);racket(96,104+b1);
 spr(GIRL,252,90+b2,true,2);racket(222,104+b2);
 // ball
 var p=(t%100)/100,d=(Math.floor(t/100)%2===0)?p:1-p;
 var bx=Math.round(98+d*(220-98)),by=Math.round(102-Math.sin(d*Math.PI)*56);
 rect("#e4ff4a",bx-3,by-3,6,6);rect("#1f2f45",bx-3,by+3,6,1);rect("#fff",bx-1,by-2,2,1);
 // twinkles
 if(Math.floor(t/20)%2===0){rect("#fff",30,18,3,3);rect("#fff",290,12,3,3);rect("#fff",150,8,3,3)}else{rect("#fff",70,10,3,3);rect("#fff",270,26,3,3)}
 t++;requestAnimationFrame(draw)}
draw();

/* petals */
(function(){var h="";for(var i=0;i<10;i++)h+='<i class="pet" style="left:'+(Math.random()*100)+'vw;animation-duration:'+(9+Math.random()*8)+'s;animation-delay:-'+(Math.random()*10)+'s"></i>';document.getElementById("petals").innerHTML=h})();

/* intro text */
var intro="Hi love! Two heroes, one little ball and a sunny court by the river in Aarhus are waiting for you. I made you a tiny game to ask something important. Ready?";
var d0=document.getElementById("d0"),i=0;(function ty(){if(i<=intro.length){d0.textContent=intro.slice(0,i++);setTimeout(ty,26)}})();
function show(id){["s0","s1","s2"].forEach(function(s){document.getElementById(s).classList.toggle("hide",s!==id)})}
document.getElementById("start").onclick=function(){show("s1")};

/* runaway NO */
var no=document.getElementById("no"),row=document.getElementById("row"),hint=document.getElementById("hint"),n=0;
var lines=["Nice try.","Too slow!","The button is shy.","Are you sure?","Just press YES.","Padel is fun, promise."];
function dodge(e){n++;var r=row.getBoundingClientRect();no.style.position="relative";no.style.left=((Math.random()-.3)*(r.width-no.offsetWidth))+"px";no.style.top=(Math.random()*120-30)+"px";hint.textContent=lines[n%lines.length];if(e&&e.preventDefault)e.preventDefault()}
["mouseenter","click","focus"].forEach(function(ev){no.addEventListener(ev,dodge)});

function hearts(k){for(var j=0;j<k;j++){var h=document.createElement("div");h.className="heart";h.textContent=j%2?"\u2665":"\u2726";h.style.left=Math.random()*100+"vw";h.style.bottom="-30px";h.style.color=["#f27fa5","#d9588a","#7fb0c9"][j%3];h.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(h);setTimeout(function(el){el.remove()}.bind(null,h),3500)}}
document.getElementById("yes").onclick=function(){hearts(40);show("s2")};

/* copy the heart so he can paste it into the chat */
document.getElementById("copy").onclick=function(){
 var s=document.getElementById("cs"),heart="\uD83D\uDC97";
 (navigator.clipboard?navigator.clipboard.writeText(heart):Promise.reject()).then(function(){s.textContent="Copied! Paste it in our chat."}).catch(function(){s.textContent="Could not copy, just send me any pink heart."});
};
/* World of Tanks fact of the day (same fact all day, button cycles to the next) */
var FACTS=[
"World of Tanks battles are 15 versus 15, and the tanks are sorted into ten tiers, from light early tanks up to tier X.",
"The real Maus, the super heavy German prototype, weighed about 188 tons. Only one survives today, at the Kubinka tank museum in Russia, built from parts of the two prototypes.",
"Shells in the game can bounce off. If an armour-piercing shell hits armour at a steep angle (about 70 degrees or more), it ricochets, which is why angling your tank matters.",
"The Soviet Object 279 had four tracks instead of two, so it could ride over very rough ground. Only one prototype was ever built, and it still exists at Kubinka.",
"Over 80,000 T-34 tanks were built during and after the Second World War, making it one of the most produced tanks in history.",
"The game has five tank classes: light tanks, medium tanks, heavy tanks, tank destroyers and artillery. Each one plays a different role on the map."];
var fi=Math.floor(Date.now()/86400000)%FACTS.length,shown=false,fb=document.getElementById("fact"),fx=document.getElementById("factbox");
fb.onclick=function(){if(shown)fi=(fi+1)%FACTS.length;shown=true;fx.textContent=FACTS[fi];fx.classList.remove("hide");fb.textContent="ANOTHER FACT"};
</script>
</body>
</html>
